version: 1

metadata:
  nombre: "Registro bibliográfico de Gustavo Bueno Martínez"
  idioma: es
  actualizado: "2026-08-30"
  criterio:
    unidad_de_registro: >-
      Título autónomo que la bibliografía cronológica de la Fundación Gustavo Bueno
      presenta en cursiva y acompaña de datos editoriales, o que identifica
      expresamente como tesis, manuscrito, informe, manual o recopilación.
    series: >-
      Teoría del cierre categorial cuenta como una sola serie, con sus cinco
      volúmenes publicados descritos de forma anidada.
    reediciones: >-
      Las reediciones, incluso cuando están corregidas o aumentadas, no generan
      un título nuevo; se consignan en edicion o notas.
    obras_completas: >-
      Los tomos de Obras Completas se registran en una sección separada y no se
      suman al catálogo de títulos para evitar duplicados.
    articulos_y_otros: >-
      Se excluyen artículos, capítulos, prólogos, entrevistas, separatas y
      materiales audiovisuales. La bibliografía cronológica canónica conserva
      el inventario de esas publicaciones.
    atribucion_disputada: >-
      Curso elemental de filosofía se conserva como antecedente bibliográfico,
      separado de la autoría documentada, porque Gustavo Bueno negó haber
      participado en su preparación.
    alcance: >-
      Registro operativo y reproducible bajo este criterio; no afirma que toda
      pieza impresa o separata de Gustavo Bueno sea un libro.
  fuentes_canonicas:
    - id: fgb_bibliografia_cronologica
      nombre: "Fundación Gustavo Bueno: Bibliografía cronológica de Gustavo Bueno"
      url: https://www.fgbueno.es/gbm/gb0bibl.htm
      uso: "Fuente maestra de títulos, años, editoriales y notas de edición."
    - id: fgb_obras_completas
      nombre: "Fundación Gustavo Bueno: Obras Completas de Gustavo Bueno"
      url: https://www.fgbueno.es/edi/ocgb.htm
      uso: "Fuente maestra de la edición autorizada de Obras Completas."
    - id: bne_gustavo_bueno
      nombre: "Biblioteca Nacional de España: Bueno, Gustavo (1924-2016)"
      url: https://datos.bne.es/resource/XX875474
      uso: "Fuente institucional de contraste para obras y ediciones catalogadas."
  conteos:
    titulos_o_series_total: 45
    autoria_o_participacion_documentada: 44
