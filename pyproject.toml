[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "colmat-x-automation"
version = "0.1.0"
description = "Automatización segura de publicaciones en X para la escuela de pensamiento Colmat"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "Colmat" }]
dependencies = [
  "Jinja2>=3.1.6,<4",
  "PyYAML>=6.0.2,<7",
  "python-dotenv>=1.1.0,<2",
  "requests>=2.32.4,<3",
  "requests-oauthlib>=2.0.0,<3",
  "typer>=0.16.0,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4.1,<9",
  "pytest-cov>=6.2.1,<7",
  "ruff>=0.12.8,<1",
]

[project.scripts]
colmat-x = "colmat_x.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/colmat_x"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["colmat_x"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
